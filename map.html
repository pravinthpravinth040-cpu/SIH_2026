  <!-- Full Screen Map Container -->
  <main class="map-wrapper" id="main-content">
    <div id="fullscreen-map" class="fullscreen-map" aria-label="Interactive map displaying active spill and vessel tracks"></div>

    <!-- Floating Glassmorphic Control Drawer -->
    <section class="map-control" id="map-control-drawer" aria-label="Map Filter Panel">
      <header class="map-control__header" id="map-drawer-header" aria-controls="map-drawer-body">
        <div class="map-control__drag-handle"></div>
        <h2 class="map-control__title h3">Attribution Controls</h2>
        <span class="badge badge--success" id="vessel-count-summary" style="margin-top: 4px;">Loading...</span>
      </header>
      
      <div class="map-control__body" id="map-drawer-body">
        <!-- Distance Slider -->
        <div class="form-group">
          <div class="slider-header">
            <label for="filter-dist" class="form-label">Attribution Distance</label>
            <span class="slider-val" id="filter-dist-val">15.0 km</span>
          </div>
          <input type="range" id="filter-dist" class="map-slider" min="1.0" max="15.0" step="0.5" value="15.0" aria-valuemin="1.0" aria-valuemax="15.0" aria-valuenow="15.0">
        </div>

        <!-- Time Window Slider -->
        <div class="form-group">
          <div class="slider-header">
            <label for="filter-time" class="form-label">AIS Correlation Window</label>
            <span class="slider-val" id="filter-time-val">60 min</span>
          </div>
          <input type="range" id="filter-time" class="map-slider" min="5" max="60" step="5" value="60" aria-valuemin="5" aria-valuemax="60" aria-valuenow="60">
        </div>
        
        <!-- Layer Toggles -->
        <fieldset style="border: none; margin: 0; padding: 0;">
          <legend class="h4" style="margin-top: var(--spacing-lg); margin-bottom: var(--spacing-sm); float: left; width: 100%;">
            Visible Layers
          </legend>
          <div class="layer-toggle">
            <label for="toggle-spill" class="form-label" style="margin-bottom: 0; font-weight: normal;">Spill Outline Polygon</label>
            <label class="switch">
              <input type="checkbox" id="toggle-spill" checked>
              <span class="slider-switch"></span>
            </label>
          </div>
          <div class="layer-toggle">
            <label for="toggle-vessels" class="form-label" style="margin-bottom: 0; font-weight: normal;">Attributed Vessels</label>
            <label class="switch">
              <input type="checkbox" id="toggle-vessels" checked>
              <span class="slider-switch"></span>
            </label>
          </div>
          <div class="layer-toggle">
            <label for="toggle-tracks" class="form-label" style="margin-bottom: 0; font-weight: normal;">Historical Vessel Tracks</label>
            <label class="switch">
              <input type="checkbox" id="toggle-tracks" checked>
              <span class="slider-switch"></span>
            </label>
          </div>
        </fieldset>
      </div>
    </section>
  </main>
